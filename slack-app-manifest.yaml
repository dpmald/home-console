display_information:
  name: Home Console
  description: Kitchen Command Center for Daniela, Warren & Wesley
  background_color: "#0c0e13"

features:
  bot_user:
    display_name: Kitchen
    always_online: true

oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public

settings:
  interactivity:
    is_enabled: true
    request_url: https://YOUR-VERCEL-DOMAIN.vercel.app/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
